<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محرر الأسهم الذكي - الإصدار المتقدم</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div class="panel">
        <input type="file" id="imageUploader" accept="image/*">
        
        <div class="control-group">
            <label>اللون:</label>
            <input type="color" id="arrowColor" value="#ff0000">
            <label>السُمك:</label>
            <input type="range" id="arrowWidth" min="1" max="20" value="5">
        </div>

        <button id="clearBtn" class="btn-danger">مسح الأسهم</button>
        <button id="exportBtn" class="btn-success">تصدير (ملف ZIP)</button>
    </div>

    <div class="panel">
        <div class="control-group">
            <input type="text" id="folderName" placeholder="اسم المجلد (مثال: مشروع 1)">
            <button id="saveFolderBtn">حفظ المجلد بالمتصفح</button>
        </div>
        <div class="control-group">
            <select id="folderSelect">
                <option value="">-- اختر مجلداً محفوظاً --</option>
            </select>
            <button id="loadFolderBtn">فتح المجلد</button>
            <button id="deleteFolderBtn" class="btn-danger">حذف</button>
        </div>
    </div>

    <canvas id="editorCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
